services:
  - type: web
    name: campusdocs-backend
    runtime: docker
    dockerfilePath: Backend/CampusDocus/Dockerfile
    dockerContext: Backend/CampusDocus
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8080
      - key: MONGODB_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: COOKIE_SECURE
        value: "true"
