spring.application.name=CampusDocus
server.port=8080

# MongoDB Atlas Configuration
spring.mongodb.uri=${MONGODB_URL:${MONGODB_URI}}
spring.mongodb.database=campusdocs
spring.data.mongodb.uri=${MONGODB_URL:${MONGODB_URI}}
spring.data.mongodb.database=campusdocs
spring.data.mongodb.auto-index-creation=true

# Server-Side Session and Cookie Security
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# Multipart File Upload Configuration (Module 2)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
app.upload.max-file-size=10485760

# Google OAuth 2.0 Credentials (Configured from environment variables or .env)
google.oauth2.client-id=${GOOGLE_CLIENT_ID:your-google-client-id.apps.googleusercontent.com}
google.oauth2.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}

# Google OAuth 2.0 Login (Identity Authentication)
spring.security.oauth2.client.registration.google.client-id=${google.oauth2.client-id}
spring.security.oauth2.client.registration.google.client-secret=${google.oauth2.client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Google Drive API Authorization (Incremental Consent)
spring.security.oauth2.client.registration.google-drive.provider=google
spring.security.oauth2.client.registration.google-drive.client-id=${google.oauth2.client-id}
spring.security.oauth2.client.registration.google-drive.client-secret=${google.oauth2.client-secret}
spring.security.oauth2.client.registration.google-drive.scope=openid,profile,email,https://www.googleapis.com/auth/drive.file
spring.security.oauth2.client.registration.google-drive.redirect-uri={baseUrl}/login/oauth2/code/google-drive

# Application Frontend URL
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
